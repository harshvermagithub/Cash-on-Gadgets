services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.fonzkart.in
    domainname: fonzkart.in
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - /data/mailserver/mail-data/:/var/mail/
      - /data/mailserver/mail-state/:/var/mail-state/
      - /data/mailserver/mail-logs/:/var/log/mail/
      - /data/mailserver/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - OVERRIDE_HOSTNAME=mail.fonzkart.in
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_SASLAUTHD=0
      - ONE_DIR=1
      - PERMIT_DOCKER=network
      - SSL_TYPE=
      - ENABLE_QUOTAS=0
      - POSTFIX_INET_PROTOCOLS=ipv4
      - DOVECOT_INET_PROTOCOLS=ipv4
      - LOG_LEVEL=debug
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25 ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
