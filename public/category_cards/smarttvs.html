<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#ecfdf5" stroke="#d1fae5" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#047857" letter-spacing="2" opacity="0.85">BEST VALUE FOR YOUR TELEVISION</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#064e3b" letter-spacing="-1">Smart TVs</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(220, 270) scale(2.4)">
            <rect x="0" y="0" width="160" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
            <rect x="5" y="5" width="150" height="90" fill="#022c22" />
            <rect x="15" y="15" width="130" height="30" rx="2" fill="#064e3b" />
            <rect x="20" y="20" width="35" height="20" rx="1" fill="rgba(239,68,68,0.4)" />
            <rect x="60" y="20" width="35" height="20" rx="1" fill="rgba(59,130,246,0.4)" />
            <rect x="100" y="20" width="35" height="20" rx="1" fill="rgba(34,197,94,0.4)" />
            <path d="M80 120 L120 120 L140 130 H60 L80 120" fill="#475569" />
        </g>
</svg>

</body>
</html>
