<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#fef2f2" stroke="#fee2e2" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#991b1b" letter-spacing="2" opacity="0.85">QUICK, RELIABLE, AFFORDABLE</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#7f1d1d" letter-spacing="-1">Repair</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(240, 290) scale(2.4)">
            <rect x="40" y="10" width="55" height="95" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
            <rect x="45" y="45" width="45" height="40" rx="2" fill="#0f172a" />
            <g transform="translate(110, 30) rotate(25)">
                <rect x="0" y="0" width="10" height="25" rx="2" fill="#ea580c" />
                <rect x="3" y="25" width="4" height="30" fill="#94a3b8" />
            </g>
        </g>
</svg>

</body>
</html>
