<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#fff7ed" stroke="#ffedd5" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#c2410c" letter-spacing="2" opacity="0.85">TOP MARKET PRICES GUARANTEED</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#7c2d12" letter-spacing="-1">Smartwatches</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(240, 280) scale(2.4)">
            <g transform="translate(30, 40) rotate(-10)">
                <path d="M25 0 V20 M25 80 V100" stroke="#cbd5e1" stroke-width="40" stroke-linecap="round" />
                <rect x="0" y="20" width="50" height="60" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2" />
                <rect x="5" y="25" width="40" height="50" rx="6" fill="#000000" />
                <circle cx="25" cy="50" r="10" stroke="#22c55e" stroke-width="2.5" fill="none" />
            </g>
            <g transform="translate(110, 50)">
                <path d="M35 0 V20 M35 70 V90" stroke="#e9d5ff" stroke-width="40" stroke-linecap="round" />
                <circle cx="35" cy="45" r="35" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
                <circle cx="35" cy="45" r="30" fill="#000000" />
                <path d="M15 45 H25 L30 35 L35 55 L40 30 L45 45 H55" stroke="#4ade80" fill="none" stroke-width="2" stroke-linecap="round" />
            </g>
        </g>
</svg>

</body>
</html>
