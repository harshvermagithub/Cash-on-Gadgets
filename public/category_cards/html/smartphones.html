<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#eff6ff" stroke="#dbeafe" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#2563eb" letter-spacing="2" opacity="0.85">INSTANT CASH FOR YOUR PHONE</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#1e3a8a" letter-spacing="-1">Smartphones</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(250, 270) scale(2.2)">
            <g transform="translate(140, 40) rotate(15)">
                <rect x="0" y="0" width="45" height="90" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" />
                <rect x="3" y="3" width="39" height="84" fill="rgba(191,219,254,0.5)" />
            </g>
            <g transform="translate(100, 30)">
                <rect x="0" y="0" width="50" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
                <rect x="3" y="15" width="44" height="80" fill="#cbd5e1" />
            </g>
            <g transform="translate(50, 50) rotate(-10)">
                <rect x="0" y="0" width="55" height="110" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
                <rect x="3" y="3" width="49" height="104" fill="#020617" />
                <g transform="translate(8, 15)">
                    <rect x="0" y="0" width="10" height="10" rx="2" fill="#60a5fa" />
                    <rect x="15" y="0" width="10" height="10" rx="2" fill="#4ade80" />
                    <rect x="29" y="0" width="10" height="10" rx="2" fill="#f87171" />
                    <rect x="0" y="15" width="10" height="10" rx="2" fill="#facc15" />
                    <rect x="15" y="15" width="10" height="10" rx="2" fill="#c084fc" />
                    <rect x="29" y="15" width="10" height="10" rx="2" fill="#f472b6" />
                </g>
            </g>
        </g>
</svg>

</body>
</html>
