<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#faf5ff" stroke="#f3e8ff" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#7e22ce" letter-spacing="2" opacity="0.85">GET UP TO ₹40,000</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#581c87" letter-spacing="-1">Tablets</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(240, 270) scale(2.4)">
            <rect x="80" y="20" width="100" height="130" rx="6" transform="rotate(10 130 85)" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
            <rect x="20" y="60" width="140" height="90" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
            <rect x="26" y="66" width="128" height="78" fill="#0f172a" />
            <circle cx="90" cy="105" r="20" fill="rgba(56,189,248,0.25)" />
            <path d="M45 125 L75 95 L95 110 L130 80" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" />
        </g>
</svg>

</body>
</html>
