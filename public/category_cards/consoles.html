<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 800px 1000px; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 800px; height: 1000px; overflow: hidden; background: #ffffff; }
        svg { display: block; width: 800px; height: 1000px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
    <!-- Card Rounded Container -->
    <rect x="20" y="20" width="760" height="960" rx="70" fill="#eef2ff" stroke="#e0e7ff" stroke-width="3"/>

    <!-- Top Subtitle -->
    <text x="70" y="110" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#4338ca" letter-spacing="2" opacity="0.85">GET UP TO ₹24,000</text>

    <!-- Top Title -->
    <text x="70" y="190" font-family="'Outfit', 'Montserrat', sans-serif" font-weight="900" font-size="68" fill="#312e81" letter-spacing="-1">Consoles</text>

    <!-- Center / Bottom Illustration -->
    
        <g transform="translate(260, 280) scale(2.4)">
            <!-- Tower -->
            <rect x="90" y="0" width="40" height="90" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
            <circle cx="110" cy="30" r="6" fill="#22c55e" stroke="#15803d" stroke-width="1" />
            <!-- Controller -->
            <g transform="translate(0, 50)">
                <rect x="0" y="0" width="70" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
                <path d="M0 0 H8 V35 H0 Z" fill="#3b82f6" />
                <path d="M62 0 H70 V35 H62 Z" fill="#ef4444" />
                <circle cx="20" cy="18" r="5" fill="#0f172a" />
                <circle cx="50" cy="18" r="5" fill="#0f172a" />
            </g>
        </g>
</svg>

</body>
</html>
