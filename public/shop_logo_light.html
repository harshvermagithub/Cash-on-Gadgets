<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FonzKart Shop Logo - LIGHT Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .page {
            width: 1400px;
            height: 400px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 40px 80px;
            padding-bottom: 70px; /* space for footer */
            position: relative;
            overflow: hidden;
        }
        
        /* Light Page Theme */
        .page.light {
            background-color: #ffffff;
            color: #0f172a;
        }
        
        /* Dark Page Theme */
        .page.dark {
            background-color: #090d16;
            color: #ffffff;
        }
        
        /* Cart Logo Layout */
        .cart-logo-container {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        
        .cart-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .gadget-cluster {
            position: absolute;
            left: 54%;
            top: 40%;
            width: 62%;
            height: 50%;
            transform: translate(-50%, -50%);
        }
        
        .phone-wrapper {
            position: absolute;
            left: 38%;
            top: 2%;
            width: 24%;
            height: 72%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Divider Line */
        .divider {
            width: 3px;
            height: 160px;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .light .divider {
            background-color: #e2e8f0;
        }
        .dark .divider {
            background-color: #1e293b;
        }
        
        /* Wordmark Brand Layout */
        .wordmark-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* Logo Phone Frame inside Wordmark */
        .logo-phone {
            width: 66px;
            height: 110px;
            position: relative;
            flex-shrink: 0;
        }
        
        .brand-text {
            font-size: 76px;
            font-weight: 900;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
        }
        
        .brand-text span {
            display: inline-block;
        }
        
        .rupee-symbol {
            color: #159c4f;
            margin: 0 4px;
        }
        
        /* Footer address bar */
        .footer-address {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            box-sizing: border-box;
            padding: 0 40px;
        }
        
        .company-name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .light .company-name {
            color: #1e293b;
        }
        .dark .company-name {
            color: #e2e8f0;
        }
        
        .address-text {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.08em;
        }
        .light .address-text {
            color: #64748b;
        }
        .dark .address-text {
            color: #94a3b8;
        }
    </style>
</head>
