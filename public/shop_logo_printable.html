<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FonzKart Printable Shop Logo Banners</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .page {
            width: 1400px;
            height: 400px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            padding: 40px 80px;
            position: relative;
            page-break-after: always;
            overflow: hidden;
        }
        
        /* Light Page Theme */
        .page.light {
            background-color: #ffffff;
            color: #0f172a;
        }
        
        /* Dark Page Theme */
        .page.dark {
            background-color: #090d16;
            color: #ffffff;
        }
        
        /* Cart Logo Layout */
        .cart-logo-container {
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        
        .cart-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .gadget-cluster {
            position: absolute;
            left: 54%;
            top: 40%;
            width: 62%;
            height: 50%;
            transform: translate(-50%, -50%);
        }
        
        .phone-wrapper {
            position: absolute;
            left: 38%;
            top: 2%;
            width: 24%;
            height: 72%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Divider Line */
        .divider {
            width: 3px;
            height: 200px;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .light .divider {
            background-color: #e2e8f0;
        }
        .dark .divider {
            background-color: #1e293b;
        }
        
        /* Wordmark Brand Layout */
        .wordmark-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* Logo Phone Frame inside Wordmark */
        .logo-phone {
            width: 72px;
            height: 120px;
            position: relative;
            flex-shrink: 0;
        }
        
        .brand-text {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: -0.04em;
            display: flex;
            align-items: center;
        }
        
        .brand-text span {
            display: inline-block;
        }
        
        .rupee-symbol {
            color: #35aa67;
            margin: 0 4px;
        }
        
        /* Label bottom right */
        .badge {
            position: absolute;
            bottom: 25px;
            right: 40px;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.4;
        }
    </style>
</head>
